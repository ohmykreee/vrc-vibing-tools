name: Build and Release

on:
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: write 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@master

      - name: prepare workspace
        run: cp -r src unity/Assets/Editor/VibingTools

      - name: pack unitypackage
        uses: game-ci/unity-builder@v5
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          customImage: 'unityci/editor:2022.3.22f1-base-3'
          projectPath: unity
          targetPlatform: StandaloneWindows64
          buildMethod: ExportUnityPackage.Export
          allowDirtyBuild: true
          versioning: None

      - name: upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: VibingTools.unitypackage
          path: unity/Build/VibingTools.unitypackage

      - name: attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: Unity/Build/VibingTools.unitypackage